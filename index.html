<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Circuit Simulator</title>

  <style>
    noscript{
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      background-color: #fff;
      z-index: 999;
      text-align: center;
    }
  </style>

  <link rel="stylesheet" href="./src/styles/styles.css" />
  <link rel="stylesheet" href="./src/styles/hover.css" />

  <script type="module" src="./src/main.ts" defer></script>
</head>

<body>

  <noscript>
    This application requires javascript to run. <br>
    Enable javascript to continue.
  </noscript>

  <!-- Main Application -->
  <main aria-label="Circuit Simulator Workspace">

    <!-- Canvas Area -->
    <canvas class="workspace" role="application" aria-label="Circuit drawing canvas" tabindex="0">
    </canvas>

    <!-- Left Toolbar -->
    <aside class="tools-left" aria-label="Main Tools">

      <!-- Mode Selection -->
      <div class="mode" role="group" aria-label="Mode Selection">

        <button class="edit icon-button selected" aria-pressed="false" title="Edit Mode (E)">
          <img src="./src/assets/wire.svg" alt="" aria-hidden="true">
          <span class="sr-only">Edit Mode</span>
        </button>

        <button class="simulate icon-button" aria-pressed="false" title="Simulate (S)">
          <img src="./src/assets/simulate.svg" alt="" aria-hidden="true">
          <span class="sr-only">Simulate</span>
        </button>
      </div>

      <!-- Undo / Redo -->
      <div class="undo-redo" role="group" aria-label="History Controls">
        <button class="undo icon-button" disabled aria-label="Undo (Ctrl + Z)">
          <img src="./src/assets/undo.svg" alt="" aria-hidden="true">
        </button>

        <button class="redo icon-button" disabled aria-label="Redo (Ctrl + Y)">
          <img src="./src/assets/undo.svg" alt="" aria-hidden="true">
        </button>
      </div>

    </aside>

    <!-- Device Bar -->
    <nav class="device-bar" aria-label="Available Devices">
    </nav>

    <!-- Right Toolbar -->
    <aside class="tools-right" aria-label="View Controls">

      <!-- General settings -->
      <div class="general-settings" role="group" aria-label="General Settings">

        <!-- Snap to Grid -->
        <button class="snap-to-grid icon-button selected" aria-pressed="true" aria-label="Toggle Snap to Grid (Shift + G)">
          <img src="./src/assets/snap.svg" alt="toggle snap to grid" aria-hidden="true">
        </button>

        <!-- Show label -->
        <button class="show-label icon-button selected" aria-pressed="true" aria-label="Toggle label (Shift + L)">
          <img src="../src/assets/label.svg" alt="toggle label" aria-hidden="true">
        </button>
      </div>

      <!-- Zoom Controls -->
      <div class="zoom-in-out" role="group" aria-label="Zoom Controls">

        <output class="zoom-percentage" aria-live="polite">
          100%
        </output>

        <button class="zoom-in icon-button" aria-label="Zoom In (Shift + Plus)">
          <img src="./src/assets/zoom-in.svg" alt="" aria-hidden="true">
        </button>

        <button class="zoom-out icon-button" aria-label="Zoom Out (Shift + Minus)">
          <img src="./src/assets/zoom-out.svg" alt="" aria-hidden="true">
        </button>
      </div>

    </aside>

  </main>

  <!-- Dialog Overlay -->
  <div class="overlay hidden" aria-hidden="true"></div>

  <!-- Devices Dialog -->
  <div class="dialog extra-devices-dialog hidden" role="dialog" aria-modal="true"
    aria-labelledby="devices-dialog-title">

    <h2 id="devices-dialog-title">Devices</h2>

    <div class="extra-devices" role="list">
    </div>

  </div>

  <!-- Debug Info -->
  <div class="info-bar" aria-live="polite">
    FPS: <span class="fps">12</span>
  </div>

</body>

</html>
